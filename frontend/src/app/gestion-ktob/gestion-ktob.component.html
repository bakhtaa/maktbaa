<h2>Gestion ktob</h2>

<div>
    <input [(ngModel)]="searchTitle" placeholder="Rechercher un livre">

    <select [(ngModel)]="selectedAuteur">
        <option value="">Tous les auteurs</option>
        <option *ngFor="let a of auteurs" [value]="a.id">
            {{ a.nom }}
        </option>
    </select>
</div>

<table class="table">

    <tr>
        <th>Image</th>
        <th>Titre</th>
        <th>Auteur</th>
        <th>Action</th>
    </tr>

    <tr *ngFor="let livre of paginatedLivres">

        <td>
            <img *ngIf="livre.image" [src]="livre.image" width="80" height="100">
        </td>

        <td>{{ livre.titre }}</td>

        <td>{{ livre.auteur?.nom }}</td>

        <td>
            <button (click)="deleteLivre(livre)">Delete</button>
        </td>

    </tr>

</table>

<div>
    <button (click)="prevPage()">Prev</button>
    <span>{{ currentPage }} / {{ totalPages }}</span>
    <button (click)="nextPage()">Next</button>
</div>
