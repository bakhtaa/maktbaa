<h2>Add Book</h2>

<form [formGroup]="formLivre" (ngSubmit)="submit()">

    <div>
        <label>Title</label>
        <input formControlName="titre" class="form-control">
    </div>

    <div>
        <label>Description</label>
        <input formControlName="description" class="form-control">
    </div>

    <div>
        <label>Price</label>
        <input formControlName="prix" type="number" class="form-control">
    </div>

    <div>
        <label>Author</label>
        <select formControlName="auteur" class="form-control">
            <option value="">Choose author</option>
            <option *ngFor="let a of auteurs" [value]="a.id">
                {{ a.nom }}
            </option>
        </select>
    </div>
    <div class="form-group">
        <label>Book Image</label>

        <input type="file" class="form-control" accept="image/*" (change)="onFileSelected($event)">
    </div>
    <button type="submit" class="btn btn-success mt-2">
        Submit
    </button>

</form>
