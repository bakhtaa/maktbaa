<h2>Author Details</h2>

<div class="page-card" *ngIf="auteur">

    <p><strong>ID:</strong> {{ auteur.id }}</p>
    <p><strong>Name:</strong> {{ auteur.nom }}</p>
    <p><strong>Nationality:</strong> {{ auteur.nationalite }}</p>
    <p><strong>Biography:</strong> {{ auteur.biographie }}</p>

</div>
